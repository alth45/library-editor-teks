<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RichEdit — Rich Text Editor JavaScript Murni</title>
<style>
  /* ===================== TEMA & DASAR ===================== */
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08), 0 2px 8px rgba(15, 23, 42, .06);
  }
  [data-theme="dark"] {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-2: #0f1729;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent-soft: #1e3a8a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background .2s, color .2s;
  }

  /* ===================== KERANGKA APP ===================== */
  .app {
    width: 100%;
    max-width: 1040px;
    height: min(86vh, 900px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .2s, border-color .2s;
  }
  .app.fullscreen {
    position: fixed;
    inset: 0;
    max-width: none;
    height: 100%;
    border-radius: 0;
    z-index: 100;
  }

  /* ===================== TOPBAR ===================== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.01em;
  }
  .brand .logo {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff;
    font-size: 15px;
  }
  .brand small {
    font-weight: 500;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .topbar-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--panel); color: var(--text); border-color: var(--border); }

  /* ===================== TOOLBAR ===================== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .toolbar.disabled { opacity: .4; pointer-events: none; }

  .group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 6px;
  }
  .group + .group { border-left: 1px solid var(--border); margin-left: 2px; }

  .tb-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tb-btn:hover { background: var(--panel-2); border-color: var(--border); }
  .tb-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .tb-btn svg { width: 17px; height: 17px; }

  .tb-select {
    height: 34px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    max-width: 130px;
  }
  .tb-select:focus { border-color: var(--accent); }

  .tb-color {
    position: relative;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .tb-color:hover { background: var(--panel-2); border-color: var(--border); }
  .tb-color .swatch {
    font-weight: 800;
    font-size: 13px;
    line-height: 1;
    padding-bottom: 2px;
    border-bottom: 3px solid var(--c, #000);
    pointer-events: none;
  }
  .tb-color input[type="color"] {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  /* ===================== AREA EDITOR ===================== */
  .surface {
    flex: 1;
    overflow: auto;
    position: relative;
    background: var(--panel);
  }
  #editor {
    min-height: 100%;
    padding: 28px 34px 60px;
    outline: none;
    font-size: 16px;
    line-height: 1.75;
    word-wrap: break-word;
  }
  #editor:empty::before {
    content: "Mulai menulis di sini…";
    color: var(--muted);
    pointer-events: none;
  }
  #editor h1 { font-size: 1.9em; margin: .6em 0 .3em; line-height: 1.25; }
  #editor h2 { font-size: 1.5em; margin: .9em 0 .3em; line-height: 1.3; }
  #editor h3 { font-size: 1.25em; margin: .9em 0 .3em; }
  #editor h4 { font-size: 1.1em; margin: .9em 0 .3em; }
  #editor p { margin: .55em 0; }
  #editor ul, #editor ol { padding-left: 1.6em; margin: .55em 0; }
  #editor li { margin: .2em 0; }
  #editor blockquote {
    margin: .9em 0;
    padding: .3em 1em;
    border-left: 3px solid var(--accent);
    color: var(--muted);
    background: var(--panel-2);
    border-radius: 0 8px 8px 0;
  }
  #editor pre {
    margin: .9em 0;
    padding: 14px 16px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  #editor code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .9em;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: .1em .35em;
    border-radius: 5px;
  }
  #editor pre code { background: none; border: none; padding: 0; }
  #editor a { color: var(--accent); text-decoration: underline; }
  #editor img { max-width: 100%; border-radius: 10px; display: block; margin: .6em 0; }
  #editor hr { border: none; border-top: 2px solid var(--border); margin: 1.4em 0; }
  #editor table { border-collapse: collapse; width: 100%; margin: .8em 0; }
  #editor td, #editor th { border: 1px solid var(--border); padding: 8px 10px; }

  /* ===================== SOURCE VIEW ===================== */
  #source {
    width: 100%;
    height: 100%;
    min-height: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 24px 30px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    background: var(--panel);
    color: var(--text);
    tab-size: 2;
  }

  /* ===================== STATUSBAR ===================== */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 18px;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .statusbar .spacer { margin-left: auto; }
  .saved-flash { color: #16a34a; transition: opacity .4s; }

  /* ===================== MODAL ===================== */
  .modal[hidden] { display: none; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    backdrop-filter: blur(2px);
  }
  .modal-box {
    position: relative;
    width: min(420px, calc(100vw - 40px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    animation: pop .16s ease-out;
  }
  @keyframes pop {
    from { transform: translateY(8px) scale(.97); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 15px; }
  .modal-box label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .modal-box input[type="text"] {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  .modal-box input[type="text"]:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-actions button {
    height: 34px;
    padding: 0 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .modal-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .modal-actions button:hover { filter: brightness(1.06); }

  /* Scrollbar halus */
  .surface::-webkit-scrollbar { width: 10px; }
  .surface::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
    border: 3px solid var(--panel);
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">✎</span>
      <span>RichEdit <small>pure JS</small></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnTheme" title="Ganti tema">🌙</button>
      <button class="icon-btn" id="btnFullscreen" title="Layar penuh">⛶</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar"></div>

  <div class="surface">
    <div id="editor" contenteditable="true" spellcheck="true"></div>
    <textarea id="source" spellcheck="false" hidden></textarea>
  </div>

  <div class="statusbar">
    <span id="statWords">0 kata</span>
    <span id="statChars">0 karakter</span>
    <span class="spacer"></span>
    <span id="statSaved">Tersimpan otomatis</span>
  </div>
</div>

<!-- ===================== MODAL GENERIK ===================== -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <h3 id="modalTitle">Judul</h3>
    <label id="modalLabel" for="modalInput">Label</label>
    <input type="text" id="modalInput" />
    <div class="modal-actions">
      <button type="button" data-close>Batal</button>
      <button type="button" class="primary" id="modalOk">Simpan</button>
    </div>
  </div>
</div>

<input type="file" id="fileImage" accept="image/*" hidden />

<script>
/* =========================================================================
   RichEdit — Rich Text Editor dengan JavaScript murni
   -------------------------------------------------------------------------
   Semua logika (toolbar, sinkronisasi state, riwayat undo/redo, sanitasi
   paste, mode sumber, autosave) ditulis manual. Untuk operasi inline
   tingkat rendah kita memakai `document.execCommand()` — ini adalah API
   bawaan browser, BUKAN library.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* 1. IKON (inline SVG supaya tidak butuh file eksternal)              */
/* ------------------------------------------------------------------ */
const svg = (p) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const ICONS = {
  undo: svg('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>'),
  redo: svg('<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>'),
  bold: '<b style="font-family:Georgia,serif;font-size:15px">B</b>',
  italic: '<i style="font-family:Georgia,serif;font-size:15px">I</i>',
  underline: '<u style="font-size:14px">U</u>',
  strike: '<s style="font-size:14px">S</s>',
  alignLeft: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="13" y2="12"/><line x1="3" y1="18" x2="17" y2="18"/>'),
  alignCenter: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>'),
  alignRight: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="11" y1="12" x2="21" y2="12"/><line x1="7" y1="18" x2="21" y2="18"/>'),
  alignJustify: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>'),
  ul: svg('<line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.4" fill="currentColor" stroke="none"/>'),
  ol: svg('<line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><text x="1.5" y="8" font-size="7" font-family="sans-serif" fill="currentColor" stroke="none">1</text><text x="1.5" y="14" font-size="7" font-family="sans-serif" fill="currentColor" stroke="none">2</text><text x="1.5" y="20" font-size="7" font-family="sans-serif" fill="currentColor" stroke="none">3</text>'),
  indent: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><path d="M3 12l5-3v6z" fill="currentColor" stroke="none" transform="translate(0,0)"/>'),
  outdent: svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><path d="M8 12l-5-3v6z" fill="currentColor" stroke="none"/>'),
  link: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
  image: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'),
  upload: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><line x1="12" y1="3" x2="12" y2="15"/>'),
  hr: svg('<line x1="3" y1="12" x2="21" y2="12"/>'),
  quote: svg('<path d="M6 17h3l2-4V7H5v6h3z"/><path d="M16 17h3l2-4V7h-6v6h3z"/>'),
  code: svg('<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'),
  clear: svg('<path d="M4 20h16"/><path d="M6.5 16.5L15 8l-3-3-8.5 8.5a2 2 0 0 0 0 2.8l.2.2a2 2 0 0 0 2.8 0z"/><path d="M13 5l6 6"/>'),
  source: svg('<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/>')
};

/* ------------------------------------------------------------------ */
/* 2. REFERENSI DOM                                                    */
/* ------------------------------------------------------------------ */
const editor    = document.getElementById('editor');
const source    = document.getElementById('source');
const toolbarEl = document.getElementById('toolbar');
const appEl     = document.getElementById('app');
const statWords = document.getElementById('statWords');
const statChars = document.getElementById('statChars');
const statSaved = document.getElementById('statSaved');
const fileImage = document.getElementById('fileImage');

/* ------------------------------------------------------------------ */
/* 3. KONFIGURASI TOOLBAR                                              */
/* ------------------------------------------------------------------ */
const TOOLBAR = [
  { items: [
    { t: 'btn', act: 'undo', icon: 'undo', title: 'Undo (Ctrl+Z)' },
    { t: 'btn', act: 'redo', icon: 'redo', title: 'Redo (Ctrl+Y)' }
  ]},
  { items: [
    { t: 'select', id: 'blockSelect', title: 'Format blok', options: [
      ['p', 'Paragraf'], ['h1', 'Judul 1'], ['h2', 'Judul 2'], ['h3', 'Judul 3'],
      ['h4', 'Judul 4'], ['blockquote', 'Kutipan'], ['pre', 'Blok kode']
    ]},
    { t: 'select', id: 'fontSelect', title: 'Jenis huruf', options: [
      ['', 'Font'], ['Arial, sans-serif', 'Arial'], ['Georgia, serif', 'Georgia'],
      ['"Times New Roman", serif', 'Times'], ['Verdana, sans-serif', 'Verdana'],
      ['"Courier New", monospace', 'Courier'], ['Impact, sans-serif', 'Impact']
    ]},
    { t: 'select', id: 'sizeSelect', title: 'Ukuran huruf', options: [
      ['', 'Ukuran'], ['12px', '12'], ['14px', '14'], ['16px', '16'], ['18px', '18'],
      ['20px', '20'], ['24px', '24'], ['30px', '30'], ['36px', '36'], ['48px', '48']
    ]}
  ]},
  { items: [
    { t: 'btn', act: 'bold', icon: 'bold', title: 'Tebal (Ctrl+B)' },
    { t: 'btn', act: 'italic', icon: 'italic', title: 'Miring (Ctrl+I)' },
    { t: 'btn', act: 'underline', icon: 'underline', title: 'Garis bawah (Ctrl+U)' },
    { t: 'btn', act: 'strikeThrough', icon: 'strike', title: 'Coret' }
  ]},
  { items: [
    { t: 'color', id: 'colorText', icon: 'A', title: 'Warna teks', value: '#e11d48' },
    { t: 'color', id: 'colorHighlight', icon: 'A', title: 'Warna sorot', value: '#fde68a', hl: true }
  ]},
  { items: [
    { t: 'btn', act: 'justifyLeft', icon: 'alignLeft', title: 'Rata kiri' },
    { t: 'btn', act: 'justifyCenter', icon: 'alignCenter', title: 'Rata tengah' },
    { t: 'btn', act: 'justifyRight', icon: 'alignRight', title: 'Rata kanan' },
    { t: 'btn', act: 'justifyFull', icon: 'alignJustify', title: 'Rata penuh' }
  ]},
  { items: [
    { t: 'btn', act: 'insertUnorderedList', icon: 'ul', title: 'Daftar berbutir' },
    { t: 'btn', act: 'insertOrderedList', icon: 'ol', title: 'Daftar bernomor' }
  ]},
  { items: [
    { t: 'btn', act: 'outdent', icon: 'outdent', title: 'Kurangi indentasi' },
    { t: 'btn', act: 'indent', icon: 'indent', title: 'Tambah indentasi' }
  ]},
  { items: [
    { t: 'btn', act: 'link', icon: 'link', title: 'Sisipkan tautan (Ctrl+K)' },
    { t: 'btn', act: 'image', icon: 'image', title: 'Gambar dari URL' },
    { t: 'btn', act: 'upload', icon: 'upload', title: 'Unggah gambar' },
    { t: 'btn', act: 'hr', icon: 'hr', title: 'Garis pemisah' }
  ]},
  { items: [
    { t: 'btn', act: 'quote', icon: 'quote', title: 'Kutipan' },
    { t: 'btn', act: 'code', icon: 'code', title: 'Blok kode' }
  ]},
  { items: [
    { t: 'btn', act: 'clear', icon: 'clear', title: 'Hapus format' },
    { t: 'btn', act: 'source', icon: 'source', title: 'Lihat sumber HTML' }
  ]}
];

/* ------------------------------------------------------------------ */
/* 4. UTILITAS                                                         */
/* ------------------------------------------------------------------ */
const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const escAttr = (s) => String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');

const debounce = (fn, ms) => {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
};

/* ------------------------------------------------------------------ */
/* 5. MANAJEMEN SELEKSI                                                */
/* ------------------------------------------------------------------ */
let savedRange = null;

/** Simpan range terakhir yang berada di dalam editor. */
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer)) {
      savedRange = r.cloneRange();
      syncToolbar();
    }
  }
});

/** Kembalikan fokus ke editor + pulihkan seleksi terakhir. */
function restoreSaved() {
  editor.focus();
  if (savedRange && editor.contains(savedRange.commonAncestorContainer)) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
}

/** Ambil posisi kursor sebagai offset karakter (untuk riwayat undo). */
function captureSelection() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.commonAncestorContainer)) return null;
  if (r.startContainer.nodeType !== 3) return null;
  const start = caretOffset(r.startContainer, r.startOffset);
  const end   = caretOffset(r.endContainer, r.endOffset);
  if (start === null || end === null) return null;
  return { start, end };
}

function caretOffset(node, offset) {
  let total = 0;
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (n === node) return total + Math.min(offset, n.nodeValue.length);
    total += n.nodeValue.length;
  }
  return null;
}

function restoreSelectionOffsets({ start, end }) {
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let pos = 0, n, sN = null, sO = 0, eN = null, eO = 0;
  while ((n = walker.nextNode())) {
    const len = n.nodeValue.length;
    if (!sN && start <= pos + len) { sN = n; sO = start - pos; }
    if (!eN && end   <= pos + len) { eN = n; eO = end - pos; }
    pos += len;
  }
  if (!sN || !eN) return;
  const r = document.createRange();
  r.setStart(sN, Math.max(0, Math.min(sO, sN.nodeValue.length)));
  r.setEnd(eN, Math.max(0, Math.min(eO, eN.nodeValue.length)));
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/* ------------------------------------------------------------------ */
/* 6. RIWAYAT UNDO / REDO (dibuat manual)                              */
/* ------------------------------------------------------------------ */
const history = { list: [], idx: -1, locked: false, limit: 120 };

function commitHistory() {
  if (history.locked) return;
  const html = editor.innerHTML;
  const current = history.list[history.idx];
  if (current && current.html === html) return;

  history.list = history.list.slice(0, history.idx + 1);
  history.list.push({ html, sel: captureSelection() });
  if (history.list.length > history.limit) history.list.shift();
  history.idx = history.list.length - 1;
  updateHistoryButtons();
}

const commitHistoryDebounced = debounce(commitHistory, 450);

function applySnapshot(snap) {
  history.locked = true;
  editor.innerHTML = snap.html;
  if (snap.sel) {
    try { restoreSelectionOffsets(snap.sel); } catch (e) { /* abaikan */ }
  }
  history.locked = false;
  updateHistoryButtons();
  syncToolbar();
  updateStats();
}

function undo() {
  if (history.idx <= 0) return;
  history.idx--;
  applySnapshot(history.list[history.idx]);
}

function redo() {
  if (history.idx >= history.list.length - 1) return;
  history.idx++;
  applySnapshot(history.list[history.idx]);
}

function updateHistoryButtons() {
  const u = toolbarEl.querySelector('[data-act="undo"]');
  const r = toolbarEl.querySelector('[data-act="redo"]');
  if (u) u.disabled = history.idx <= 0;
  if (r) r.disabled = history.idx >= history.list.length - 1;
}

/* ------------------------------------------------------------------ */
/* 7. MEMBANGUN TOOLBAR                                                */
/* ------------------------------------------------------------------ */
function buildToolbar() {
  TOOLBAR.forEach(group => {
    const g = document.createElement('div');
    g.className = 'group';

    group.items.forEach(item => {
      if (item.t === 'btn') {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tb-btn';
        b.dataset.act = item.act;
        b.title = item.title;
        b.innerHTML = ICONS[item.icon] || item.act;
        g.appendChild(b);
      }

      else if (item.t === 'select') {
        const s = document.createElement('select');
        s.className = 'tb-select';
        s.id = item.id;
        s.title = item.title;
        item.options.forEach(([value, label]) => {
          const o = document.createElement('option');
          o.value = value;
          o.textContent = label;
          s.appendChild(o);
        });
        g.appendChild(s);
      }

      else if (item.t === 'color') {
        const label = document.createElement('label');
        label.className = 'tb-color';
        label.title = item.title;
        const span = document.createElement('span');
        span.className = 'swatch';
        span.textContent = item.icon;
        span.style.setProperty('--c', item.value);
        if (item.hl) span.style.background = item.value;
        const input = document.createElement('input');
        input.type = 'color';
        input.id = item.id;
        input.value = item.value;
        label.appendChild(span);
        label.appendChild(input);
        g.appendChild(label);
      }
    });

    toolbarEl.appendChild(g);
  });
}

/* ------------------------------------------------------------------ */
/* 8. SINKRONISASI STATE TOOLBAR                                       */
/* ------------------------------------------------------------------ */
const STATE_CMDS = [
  'bold', 'italic', 'underline', 'strikeThrough',
  'justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull',
  'insertUnorderedList', 'insertOrderedList'
];

function syncToolbar() {
  // Status tombol inline
  STATE_CMDS.forEach(cmd => {
    const btn = toolbarEl.querySelector(`[data-act="${cmd}"]`);
    if (!btn) return;
    let on = false;
    try { on = document.queryCommandState(cmd); } catch (e) { /* noop */ }
    btn.classList.toggle('active', on);
  });

  // Format blok
  const tag = currentBlockTag();
  const blockSel = document.getElementById('blockSelect');
  if (blockSel) {
    const found = [...blockSel.options].some(o => o.value === tag);
    blockSel.value = found ? tag : 'p';
  }

  // Font & ukuran
  const fontSel = document.getElementById('fontSelect');
  const sizeSel = document.getElementById('sizeSelect');
  try {
    const font = document.queryCommandValue('fontName');
    if (fontSel && font) {
      const match = [...fontSel.options].find(o => o.value && o.value.split(',')[0].replace(/"/g, '') === font.replace(/"/g, ''));
      if (match) fontSel.value = match.value;
    }
  } catch (e) { /* noop */ }

  if (sizeSel) {
    const px = currentFontSize();
    const match = [...sizeSel.options].find(o => o.value && parseFloat(o.value) === px);
    sizeSel.value = match ? match.value : '';
  }
}

function currentBlockTag() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return 'p';
  let node = sel.getRangeAt(0).startContainer;
  if (node.nodeType === 3) node = node.parentNode;
  while (node && node !== editor) {
    if (/^(P|H[1-6]|BLOCKQUOTE|PRE)$/.test(node.tagName)) {
      return node.tagName.toLowerCase();
    }
    node = node.parentNode;
  }
  return 'p';
}

function currentFontSize() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  let node = sel.getRangeAt(0).startContainer;
  if (node.nodeType === 3) node = node.parentNode;
  if (!node || !editor.contains(node)) return 0;
  return Math.round(parseFloat(getComputedStyle(node).fontSize) || 0);
}

/* ------------------------------------------------------------------ */
/* 9. PERINTAH                                                         */
/* ------------------------------------------------------------------ */

/** Jalankan execCommand dengan seleksi yang sudah dipulihkan. */
function cmd(command, value = null) {
  restoreSaved();
  document.execCommand(command, false, value);
  commitHistory();
  syncToolbar();
  updateStats();
}

/** Handler utama untuk tombol toolbar. */
function runAction(act) {
  switch (act) {
    case 'undo': undo(); break;
    case 'redo': redo(); break;

    case 'link':   insertLink(); break;
    case 'image':  insertImageUrl(); break;
    case 'upload': fileImage.click(); break;

    case 'hr': {
      restoreSaved();
      document.execCommand('insertHorizontalRule');
      commitHistory();
      break;
    }

    case 'quote': {
      restoreSaved();
      const isQuote = currentBlockTag() === 'blockquote';
      document.execCommand('formatBlock', false, isQuote ? 'p' : 'blockquote');
      commitHistory();
      syncToolbar();
      break;
    }

    case 'code': {
      restoreSaved();
      const isPre = currentBlockTag() === 'pre';
      document.execCommand('formatBlock', false, isPre ? 'p' : 'pre');
      commitHistory();
      syncToolbar();
      break;
    }

    case 'clear': {
      restoreSaved();
      document.execCommand('removeFormat');
      document.execCommand('formatBlock', false, 'p');
      document.execCommand('unlink');
      commitHistory();
      syncToolbar();
      break;
    }

    case 'source':
      toggleSource();
      break;

    default:
      cmd(act);
  }
}

/* --------------------------- Ukuran font --------------------------- */
let lastFontSize = '16px';

function setFontSize(px) {
  restoreSaved();
  lastFontSize = px;

  // Trik klasik: execCommand hanya mendukung size 1..7, jadi kita pakai
  // size 7 lalu ganti <font size="7"> menjadi <span style="font-size:..">
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, '7');
  document.execCommand('styleWithCSS', false, true);

  fixFontSizeTags();
  commitHistory();
}

function fixFontSizeTags() {
  editor.querySelectorAll('font[size="7"]').forEach(el => {
    const span = document.createElement('span');
    span.style.fontSize = lastFontSize;
    while (el.firstChild) span.appendChild(el.firstChild);
    el.replaceWith(span);
  });
}

/* ----------------------------- Warna ------------------------------ */
function setTextColor(color) {
  restoreSaved();
  document.execCommand('foreColor', false, color);
  commitHistory();
}

function setHighlight(color) {
  restoreSaved();
  const ok = document.execCommand('hiliteColor', false, color);
  if (!ok) document.execCommand('backColor', false, color);
  commitHistory();
}

/* ----------------------------- Tautan ----------------------------- */
async function insertLink() {
  const url = await askModal({
    title: 'Sisipkan Tautan',
    label: 'URL tujuan',
    value: 'https://',
    placeholder: 'https://contoh.com'
  });
  if (!url) return;

  restoreSaved();
  const sel = window.getSelection();
  const collapsed = sel.isCollapsed;

  if (collapsed) {
    document.execCommand('insertHTML', false,
      `<a href="${escAttr(url)}" target="_blank" rel="noopener noreferrer">${escHtml(url)}</a>`);
  } else {
    document.execCommand('createLink', false, url);
    editor.querySelectorAll('a').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }
  commitHistory();
}

/* ----------------------------- Gambar ----------------------------- */
async function insertImageUrl() {
  const url = await askModal({
    title: 'Sisipkan Gambar',
    label: 'URL gambar',
    value: 'https://',
    placeholder: 'https://contoh.com/gambar.jpg'
  });
  if (!url) return;

  restoreSaved();
  document.execCommand('insertHTML', false,
    `<img src="${escAttr(url)}" alt="" style="max-width:100%">`);
  commitHistory();
}

fileImage.addEventListener('change', () => {
  const file = fileImage.files && fileImage.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    restoreSaved();
    document.execCommand('insertHTML', false,
      `<img src="${reader.result}" alt="" style="max-width:100%">`);
    commitHistory();
    fileImage.value = '';
  };
  reader.readAsDataURL(file);
});

/* ------------------------------------------------------------------ */
/* 10. MODE SUMBER HTML                                                */
/* ------------------------------------------------------------------ */
let sourceMode = false;

function toggleSource() {
  sourceMode = !sourceMode;
  const btn = toolbarEl.querySelector('[data-act="source"]');

  if (sourceMode) {
    source.value = editor.innerHTML;
    editor.hidden = true;
    source.hidden = false;
    source.focus();
    toolbarEl.classList.add('disabled');
  } else {
    editor.innerHTML = source.value;
    source.hidden = true;
    editor.hidden = false;
    toolbarEl.classList.remove('disabled');
    editor.focus();
    commitHistory();
    updateStats();
  }
  if (btn) btn.classList.toggle('active', sourceMode);
}

/* ------------------------------------------------------------------ */
/* 11. SANITASI PASTE                                                  */
/* ------------------------------------------------------------------ */
const ALLOWED_TAGS = new Set([
  'P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'INS', 'MARK',
  'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
  'UL', 'OL', 'LI', 'BLOCKQUOTE', 'PRE', 'CODE', 'SPAN', 'DIV', 'A', 'IMG', 'HR',
  'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TD', 'TH'
]);

const ALLOWED_ATTRS = {
  A: ['href', 'title'],
  IMG: ['src', 'alt', 'width', 'height'],
  TD: ['colspan', 'rowspan'],
  TH: ['colspan', 'rowspan'],
  '*': ['style']
};

const ALLOWED_STYLES = [
  'color', 'background-color', 'font-weight', 'font-style',
  'text-decoration', 'text-decoration-line', 'text-align',
  'font-size', 'font-family'
];

function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  function cleanAttrs(el) {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const allowed = (ALLOWED_ATTRS[el.tagName] || []).concat(ALLOWED_ATTRS['*']);

      if (name.startsWith('on') || !allowed.includes(name)) {
        el.removeAttribute(attr.name);
        return;
      }

      if (name === 'style') {
        const keep = {};
        ALLOWED_STYLES.forEach(prop => {
          const v = el.style.getPropertyValue(prop);
          if (v) keep[prop] = v;
        });
        el.removeAttribute('style');
        Object.entries(keep).forEach(([p, v]) => el.style.setProperty(p, v));
      }

      if (name === 'href' || name === 'src') {
        const v = (attr.value || '').trim().toLowerCase();
        if (v.startsWith('javascript:') || v.startsWith('data:text/html')) {
          el.removeAttribute(attr.name);
        }
      }
    });
  }

  function cleanChildren(parent) {
    let node = parent.firstChild;
    while (node) {
      const next = node.nextSibling;

      if (node.nodeType === 3) { node = next; continue; }
      if (node.nodeType !== 1) { parent.removeChild(node); node = next; continue; }

      if (!ALLOWED_TAGS.has(node.tagName)) {
        // Buka pembungkusnya (unwrap) lalu lanjutkan dari anak pertamanya
        const first = node.firstChild;
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        parent.removeChild(node);
        node = first || next;
        continue;
      }

      cleanAttrs(node);
      cleanChildren(node);
      node = next;
    }
  }

  cleanChildren(doc.body);
  return doc.body.innerHTML;
}

editor.addEventListener('paste', (e) => {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');

  if (html && !e.shiftKey) {
    document.execCommand('insertHTML', false, sanitizeHTML(html));
  } else {
    document.execCommand('insertText', false, text);
  }
  commitHistory();
  updateStats();
});

/* ------------------------------------------------------------------ */
/* 12. MODAL GENERIK                                                   */
/* ------------------------------------------------------------------ */
const modal      = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalLabel = document.getElementById('modalLabel');
const modalInput = document.getElementById('modalInput');
const modalOk    = document.getElementById('modalOk');
let modalResolve = null;

function askModal({ title, label, value = '', placeholder = '' }) {
  return new Promise(resolve => {
    modalTitle.textContent = title;
    modalLabel.textContent = label;
    modalInput.value = value;
    modalInput.placeholder = placeholder;
    modal.hidden = false;
    modalResolve = resolve;
    setTimeout(() => { modalInput.focus(); modalInput.select(); }, 30);
  });
}

function closeModal(result) {
  modal.hidden = true;
  if (modalResolve) {
    modalResolve(result);
    modalResolve = null;
  }
}

modalOk.addEventListener('click', () => closeModal(modalInput.value.trim() || null));
modal.querySelectorAll('[data-close]').forEach(el =>
  el.addEventListener('click', () => closeModal(null)));

modalInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); closeModal(modalInput.value.trim() || null); }
  if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
});

/* ------------------------------------------------------------------ */
/* 13. EVENT TOOLBAR                                                   */
/* ------------------------------------------------------------------ */
toolbarEl.addEventListener('mousedown', (e) => {
  // Cegah kehilangan seleksi saat tombol diklik
  if (e.target.closest('button')) e.preventDefault();
});

toolbarEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  runAction(btn.dataset.act);
});

toolbarEl.addEventListener('change', (e) => {
  const el = e.target;

  if (el.id === 'blockSelect') {
    restoreSaved();
    document.execCommand('formatBlock', false, el.value);
    commitHistory();
    syncToolbar();
  }

  if (el.id === 'fontSelect' && el.value) {
    restoreSaved();
    document.execCommand('fontName', false, el.value);
    commitHistory();
    syncToolbar();
  }

  if (el.id === 'sizeSelect' && el.value) {
    setFontSize(el.value);
    syncToolbar();
  }

  if (el.id === 'colorText') {
    setTextColor(el.value);
    el.previousElementSibling.style.setProperty('--c', el.value);
  }

  if (el.id === 'colorHighlight') {
    setHighlight(el.value);
    el.previousElementSibling.style.background = el.value;
  }
});

/* ------------------------------------------------------------------ */
/* 14. EVENT EDITOR                                                    */
/* ------------------------------------------------------------------ */
editor.addEventListener('input', () => {
  fixFontSizeTags();
  updateStats();
  commitHistoryDebounced();
  saveContentDebounced();
});

editor.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;

  // Shortcut manual (supaya toolbar tetap sinkron)
  if (mod) {
    const map = { b: 'bold', i: 'italic', u: 'underline' };
    const key = e.key.toLowerCase();
    if (map[key]) {
      e.preventDefault();
      cmd(map[key]);
      return;
    }
    if (key === 'k') { e.preventDefault(); insertLink(); return; }
    if (key === 'z') {
      e.preventDefault();
      e.shiftKey ? redo() : undo();
      return;
    }
    if (key === 'y') { e.preventDefault(); redo(); return; }
  }

  // Tab = 4 spasi
  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '    ');
    commitHistory();
  }
});

/* ------------------------------------------------------------------ */
/* 15. STATISTIK & AUTOSAVE                                            */
/* ------------------------------------------------------------------ */
function updateStats() {
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  statWords.textContent = `${words} kata`;
  statChars.textContent = `${text.length} karakter`;
}

const STORAGE_KEY = 'richedit:content:v1';

const saveContentDebounced = debounce(() => {
  try {
    localStorage.setItem(STORAGE_KEY, editor.innerHTML);
    statSaved.textContent = 'Tersimpan ✓';
    statSaved.classList.add('saved-flash');
    setTimeout(() => {
      statSaved.classList.remove('saved-flash');
      statSaved.textContent = 'Tersimpan otomatis';
    }, 1200);
  } catch (e) { /* kuota penuh, abaikan */ }
}, 800);

/* ------------------------------------------------------------------ */
/* 16. TEMA & FULLSCREEN                                               */
/* ------------------------------------------------------------------ */
const btnTheme = document.getElementById('btnTheme');
btnTheme.addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  btnTheme.textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('richedit:theme', isDark ? 'light' : 'dark');
});

document.getElementById('btnFullscreen').addEventListener('click', () => {
  appEl.classList.toggle('fullscreen');
});

/* ------------------------------------------------------------------ */
/* 17. KONTEN AWAL & INISIALISASI                                      */
/* ------------------------------------------------------------------ */
const DEFAULT_HTML = `
<h1>Selamat datang di RichEdit ✎</h1>
<p>Ini adalah <b>rich text editor</b> yang dibangun <i>100% dengan JavaScript murni</i> —
tanpa library seperti Quill, TinyMCE, atau CKEditor.</p>
<p>Blok teks ini lalu tekan <b>Ctrl+B</b>, <b>Ctrl+I</b>, atau <b>Ctrl+U</b>.</p>
<blockquote>Semua tombol toolbar ditulis manual. Setiap perintah mengeksekusi API DOM,
lalu state-nya disinkronkan kembali dengan posisi kursor.</blockquote>
<h2>Fitur</h2>
<ul>
  <li>Format teks: tebal, miring, garis bawah, coret</li>
  <li>Heading, kutipan, blok kode, garis pemisah</li>
  <li>Warna teks &amp; warna sorotan</li>
  <li>Daftar berbutir dan bernomor, indentasi</li>
  <li>Tautan, gambar dari URL, unggah gambar</li>
  <li>Undo/redo dengan riwayat buatan sendiri</li>
  <li>Mode sumber HTML, autosave, tema gelap</li>
</ul>
<p>Selamat mencoba! 🎉</p>
`;

function init() {
  // --- Konfigurasi execCommand ---
  try {
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('defaultParagraphSeparator', false, 'p');
  } catch (e) { /* noop */ }

  // --- Tema ---
  const savedTheme = localStorage.getItem('richedit:theme');
  if (savedTheme) {
    document.documentElement.dataset.theme = savedTheme;
    btnTheme.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }

  // --- Toolbar ---
  buildToolbar();

  // --- Konten ---
  const saved = localStorage.getItem(STORAGE_KEY);
  editor.innerHTML = saved !== null ? saved : DEFAULT_HTML;

  // --- State awal ---
  commitHistory();
  updateStats();
  syncToolbar();

  // Fokus awal
  setTimeout(() => editor.focus(), 100);
}

init();
